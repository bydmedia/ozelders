:root {

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg-color);transition:background 0.3s ease; font-family:'DM Sans',sans-serif; color:var(--text-main); font-size:12px; line-height:1.4;}

.corp-btn:active { transform: scale(0.98); }
.corp-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.corp-btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 4px rgba(14, 165, 233, 0.2); }
.corp-btn-secondary { background: #FFFFFF; border-color: var(--border); color: var(--text-main); }
.corp-btn-danger { background: var(--danger-bg); color: var(--danger); }
.corp-btn-success { background: var(--success-bg); color: var(--success); }

.list-row { display: grid; gap: 10px; align-items: center; padding: 10px 14px; background: #fff; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
.list-header { display: grid; gap: 10px; align-items: center; padding: 10px 14px; background: #E2E8F0; border: 1px solid var(--border); border-radius: 8px; font-weight: 800; color: var(--text-sub); font-size: 10.5px; text-transform: uppercase; margin-bottom: 10px; }
.sidebar-desktop { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; z-index: 100; transition: transform 0.3s; }
.sidebar-desktop .nav-parent { color: #94A3B8; background: transparent; border: none; border-radius: 6px; padding: 10px 14px; width: 100%; text-align: left; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; }
.sidebar-desktop .nav-parent:hover { background: rgba(255,255,255,0.06); color: #fff;}
.sidebar-desktop .nav-parent.active { color: #FFFFFF; background: var(--accent); }
.sidebar-desktop .nav-child { color: #94A3B8; background: transparent; border: none; border-radius: 6px; padding: 8px 14px 8px 36px; width: 100%; text-align: left; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; }
.sidebar-desktop .nav-child:hover { color: #fff; background: rgba(255,255,255,0.06); }

.mobile-topbar { display: none; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--sidebar-bg); border-bottom: 1px solid var(--sidebar-border); color: #fff; z-index: 80; }
.mobile-topbar .menu-btn { background: transparent; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; padding: 4px; border-radius: 6px; }
.mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(11, 17, 33, 0.7); z-index: 90; backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.mobile-overlay.open { display: block; opacity: 1; pointer-events: auto; }
.tab-container { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; gap: 6px; padding-bottom: 2px; scrollbar-width: none; }
@media (max-width: 900px) {

function fmtDate(d){ if(!d || typeof d !== 'string') return "—"; try { const parts = d.split("-"); return parts.length !== 3 ? d : `${parts[2]}.${parts[1]}.${parts[0]}`; } catch(e) { return d; } }
function sortDateDesc(a, b) { const tA = new Date(a.date || 0).getTime() || 0; const tB = new Date(b.date || 0).getTime() || 0; if (tA === tB) return (b.id || 0) - (a.id || 0); return tB - tA; }
function totalPaid(s){return safeArr(s?.payments).reduce((t,p)=>t+Number(p.amount||0),0);}
function equipmentTotal(s){return safeArr(s?.equipment).reduce((t,e)=>t+Number(e.price||0),0);}
function monthlyTotal(s){return Number(s?.monthlyFee||0)-Number(s?.discount||0)+equipmentTotal(s)+(s?.hasTransport?Number(s?.transportFee||0):0);}
function courseStatus(s){ if(!s?.courseStart||!s?.courseEnd)return"unknown"; const now=new Date(TODAY),st=new Date(s.courseStart),en=new Date(s.courseEnd); if(now<st)return"upcoming";if(now>en)return"ended";return"active"; }
function daysLeft(s){ try { return Math.ceil((new Date(s?.courseEnd)-new Date(TODAY))/86400000); } catch(e){ return 0; } }
function age(dob){ if(!dob)return"—"; try { return Math.floor((Date.now()-new Date(dob))/31557600000); } catch(e){ return "—"; } }
function calcEndDate(start,total,days){ try { if(!start||!total||!days||days.length===0)return""; let d=new Date(start); if(isNaN(d.getTime())) return ""; let cnt=0,iter=0; const safeDays = safeArr(days).map(Number); while(cnt<total && iter<total*30){ if(safeDays.includes(d.getDay())) cnt++; if(cnt<total) d.setDate(d.getDate()+1); iter++; } return d.toISOString().split("T")[0]; } catch(e) { return ""; } }
function calcRemainingSessions(s) { try { if (!s || !s.courseStart || !s.totalSessions || !s.weekDays || s.weekDays.length === 0) return 0; const total = Number(s.totalSessions || 0); const start = new Date(s.courseStart); if(isNaN(start.getTime())) return 0; const end = s.courseEnd ? new Date(s.courseEnd) : new Date(TODAY); const current = new Date(TODAY); let targetEnd = current < end ? current : end; if (targetEnd < start) return total; let passedSessions = 0; let iter = new Date(start); const safeDays = safeArr(s.weekDays).map(Number); while (iter <= targetEnd && passedSessions < total) { if (safeDays.includes(iter.getDay())) passedSessions++; iter.setDate(iter.getDate() + 1); } return Math.max(0, total - passedSessions); } catch(e) { return 0; } }

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }

function DayPicker({value=[],onChange}){ const safeVal = safeArr(value).map(Number); return<div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>{DAYS_TR.map((d,i)=>{const on=safeVal.includes(i);return<button key={i} type="button" onClick={()=>onChange(on?safeVal.filter(x=>x!==i):[...safeVal,i].sort())} style={{width:38,height:38,borderRadius:6,border:`1px solid ${on?"var(--accent)":"var(--border)"}`,background:on?"var(--accent-light)":"var(--card-bg)",color:on?"var(--accent)":"var(--text-sub)",cursor:"pointer",fontSize:12,fontWeight:800,fontFamily:"inherit",transition:"all 0.2s"}}>{d}</button>})}</div> }

function CircleChart({pct, label, col, size=110, stroke=10}) {
   const r = (size - stroke) / 2; const circ = 2 * Math.PI * r; const dash = (pct * circ) / 100;
   return <div style={{display:"flex", flexDirection:"column", alignItems:"center"}}>
     <svg width={size} height={size}>
       <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg-color)" strokeWidth={stroke}/>
       <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={stroke} strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:"stroke-dasharray 1s ease-out"}}/>
       <text className="num" x="50%" y="50%" textAnchor="middle" dy=".35em" fill="var(--text-main)" fontSize={size > 120 ? "17" : "14"} fontWeight="900">{pct}%</text>
     </svg>
     <div style={{fontSize:10.5, fontWeight:800, color:"var(--text-sub)", marginTop:12, textTransform:"uppercase", textAlign:"center", width:"100%", letterSpacing:0.5}}>{label}</div>
   </div>
}
function CashFlowDonut({rev, exp}) {
   const size = 130, stroke = 15; const r = (size - stroke) / 2; const circ = 2 * Math.PI * r;
   const total = rev + exp || 1; const revPct = rev / total; const expPct = exp / total;
   const revDash = revPct * circ; const expDash = expPct * circ;
   return <div style={{position:"relative", width:size, height:size, margin:"0 auto"}}>
     <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
       <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--danger)" strokeWidth={stroke} strokeDasharray={`${expDash} ${circ}`} strokeLinecap="round" />
       <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--success)" strokeWidth={stroke} strokeDasharray={`${revDash} ${circ}`} strokeDashoffset={-expDash} strokeLinecap="round" />
     </svg>
     <div style={{position:"absolute", top:0, left:0, width:"100%", height:"100%", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center"}}>
        <div style={{fontSize:10, fontWeight:800, color:"var(--text-sub)", letterSpacing:0.5}}>NET KASA</div><div className="num" style={{fontSize:15, fontWeight:900, color:"var(--text-main)", marginTop:2}}>{(rev - exp).toLocaleString()} ₺</div>
     </div>
   </div>
}
function PremiumAreaChart({data}) {
  const h=180; const max = Math.max(...data.map(d=>Math.max(d.rev, d.exp, 1))) * 1.15;
  const step = 100 / (data.length - 1 || 1);
  const revPoints = data.map((d,i) => `${i*step},${100 - (d.rev/max)*100}`).join(" "); const expPoints = data.map((d,i) => `${i*step},${100 - (d.exp/max)*100}`).join(" ");
  return (
    <div style={{width:"100%", position:"relative", marginTop:16}}>
      <div style={{height:h, width:"100%"}}>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style={{width:"100%", height:"100%", overflow:"visible"}}>
          <line x1="0" y1="25" x2="100" y2="25" stroke="var(--border)" strokeWidth="0.5" strokeDasharray="2 2"/> <line x1="0" y1="50" x2="100" y2="50" stroke="var(--border)" strokeWidth="0.5" strokeDasharray="2 2"/>
          <line x1="0" y1="75" x2="100" y2="75" stroke="var(--border)" strokeWidth="0.5" strokeDasharray="2 2"/> <line x1="0" y1="100" x2="100" y2="100" stroke="var(--border)" strokeWidth="1"/>
          {data.length > 1 && <> <polygon points={`0,100 ${revPoints} 100,100`} fill="var(--success-bg)" opacity="0.6"/> <polygon points={`0,100 ${expPoints} 100,100`} fill="var(--danger-bg)" opacity="0.6"/> </>}
          <polyline points={revPoints} fill="none" stroke="var(--success)" strokeWidth="2" vectorEffect="non-scaling-stroke" strokeLinecap="round" strokeLinejoin="round"/>
          <polyline points={expPoints} fill="none" stroke="var(--danger)" strokeWidth="2" vectorEffect="non-scaling-stroke" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </div>
      <div style={{display:"flex", justifyContent:"space-between", marginTop:10, overflowX:"auto", paddingBottom:4}}> {data.map((d,i) => <div key={i} style={{fontSize:10.5, color:"var(--text-sub)", fontWeight:800, flexShrink:0}}>{d.label.slice(0,3)}</div>)} </div>
      <div style={{display:"flex", gap:16, marginTop:12, justifyContent:"center", fontSize:11.5, fontWeight:800}}> <span style={{color:"var(--success)"}}>■ Aylık Gelirler</span><span style={{color:"var(--danger)"}}>■ Aylık Giderler</span> </div>
    </div>
  )
}

function Dashboard({students,expenses}){
  const safeStudents = safeArr(students); const active = safeStudents.filter(s=>courseStatus(s)==="active");
  const allPayments = safeStudents.flatMap(s=>safeArr(s.payments).map(p=>({...p, studentName: s.name})));
  const totalRev = allPayments.reduce((t, p) => t + Number(p.amount), 0); const totalExp = safeArr(expenses).reduce((t, e) => t + Number(e.amount), 0);
  const todayRev = allPayments.filter(p => p.date === TODAY).reduce((t, p) => t + Number(p.amount), 0); const monthRev = allPayments.filter(p => p.date && p.date.startsWith(TODAY.slice(0, 7))).reduce((t, p) => t + Number(p.amount), 0);
  const expRev = active.reduce((t, s) => t + monthlyTotal(s), 0); const colRev = active.reduce((t, s) => t + totalPaid(s), 0);
  const collectionRate = expRev === 0 ? 100 : Math.min(100, Math.round((colRev / expRev) * 100));
  const todayDay = new Date(TODAY).getDay(); const expectedToday = active.filter(s => safeArr(s.weekDays).includes(todayDay));
  const absentToday = expectedToday.filter(s => !(s.attendance||{})[TODAY]);
  const absenceRate = expectedToday.length === 0 ? 0 : Math.round((absentToday.length / expectedToday.length) * 100);

  const currentYear = TODAY.slice(0, 4); const mData = {};
  for(let i=1; i<=12; i++) mData[`${currentYear}-${String(i).padStart(2,'0')}`] = { rev: 0, exp: 0, label: MONTHS_TR[i-1] };
  allPayments.filter(p => p.date && p.date.startsWith(currentYear)).forEach(p => { const m = p.date.slice(0, 7); if(mData[m]) mData[m].rev += Number(p.amount); });
  safeArr(expenses).filter(e => e.date && e.date.startsWith(currentYear)).forEach(e => { const m = e.date.slice(0, 7); if(mData[m]) mData[m].exp += Number(e.amount); });
  const chartData = Object.values(mData);

  return<div className="main-content" style={{padding:24, maxWidth:1300, margin:"0 auto"}}>
    <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:24}}>
       <div style={{fontSize:22, fontWeight:900, color:"var(--text-main)", letterSpacing:-0.5}}>Sistem Özeti</div>
    </div>
    <Card style={{marginBottom:24, display:"flex", alignItems:"center", gap:20, flexWrap:"wrap", padding:"16px 24px"}}>
       <div style={{flex:1, minWidth:200, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center"}}>
          <div style={{fontSize:13, fontWeight:900, marginBottom:12, color:"var(--text-main)", textTransform:"uppercase"}}>Nakit Akışı Özeti</div><CashFlowDonut rev={totalRev} exp={totalExp} />
       </div>
       <div style={{flex:2, minWidth:280, display:"flex", flexDirection:"column", gap:12}}>
          <div style={{padding:"14px 18px", borderRadius:12, background:"var(--success-bg)", border:"1px solid rgba(5,150,105,0.2)", display:"flex", justifyContent:"space-between", alignItems:"center"}}>
             <div><div style={{fontSize:11.5, fontWeight:800, color:"var(--success)", textTransform:"uppercase", letterSpacing:0.5}}>Toplam Kasa Ciro</div><div style={{fontSize:11, fontWeight:600, color:"var(--success)", opacity:0.8, marginTop:2}}>Kayıtlı tüm ödemeler</div></div><div className="num" style={{fontSize:18, fontWeight:900, color:"var(--success)"}}>+ {totalRev.toLocaleString()} ₺</div>
          </div>
          <div style={{padding:"14px 18px", borderRadius:12, background:"var(--danger-bg)", border:"1px solid rgba(220,38,38,0.2)", display:"flex", justifyContent:"space-between", alignItems:"center"}}>
             <div><div style={{fontSize:11.5, fontWeight:800, color:"var(--danger)", textTransform:"uppercase", letterSpacing:0.5}}>Toplam Kurum Gideri</div><div style={{fontSize:11, fontWeight:600, color:"var(--danger)", opacity:0.8, marginTop:2}}>İşlenen harcamalar</div></div><div className="num" style={{fontSize:18, fontWeight:900, color:"var(--danger)"}}>- {totalExp.toLocaleString()} ₺</div>
          </div>
       </div>
    </Card>
    <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(220px, 1fr))", gap:16, marginBottom:20}}>
      <StatCard label="Bugünkü Gelir" value={`${todayRev.toLocaleString()} ₺`} col="var(--success)" /> <StatCard label="Aylık Gelir" value={`${monthRev.toLocaleString()} ₺`} col="var(--accent)" />
      <StatCard label="Tahsilat Oranı" value={`%${collectionRate}`} /> <StatCard label="Aktif Öğrenci" value={active.length} />
    </div>
    <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(320px, 1fr))", gap:20, alignItems:"start", marginBottom:20}}>
      <Card style={{margin:0}}><div style={{fontSize:13.5, fontWeight:800, marginBottom:16, color:"var(--text-main)", textTransform:"uppercase"}}>📊 {currentYear} Yılı Finans Analizi</div><PremiumAreaChart data={chartData} /></Card>
      <Card style={{margin:0, display:"flex", justifyContent:"space-around", alignItems:"center", padding:"30px 16px"}}><CircleChart pct={collectionRate} label="Tahsilat Oranı" col={collectionRate < 70 ? "var(--danger)" : "var(--success)"} size={140} /><CircleChart pct={absenceRate} label="Günlük Devamsızlık" col={absenceRate > 30 ? "var(--warning)" : "var(--accent)"} size={140} /></Card>
    </div>
  </div>
}

      <Inp label="Kısa Özgeçmiş" value={aboutForm.text} onChange={v=>setAboutForm({...aboutForm, text:v})} rows={3} />
      <Inp label="Felsefem (Tırnak İçi Yazı)" value={aboutForm.philosophy} onChange={v=>setAboutForm({...aboutForm, philosophy:v})} rows={2} />
      <Inp label="Sertifikalar (Her satıra bir tane yazın)" value={aboutForm.certs} onChange={v=>setAboutForm({...aboutForm, certs:v})} rows={5} />
      <Btn onClick={()=>saveSection('about', aboutForm)} style={{marginTop: 10, padding: 12}}>Hakkımda Bilgilerini Kaydet</Btn>
    </Card>}

    {tab===1 && <Card>
      {safeBranches.length===0?<div style={{textAlign:"center",padding:40,color:"var(--text-sub)",fontWeight:700}}>Eklenmiş branş bulunmuyor.</div>:
      safeBranches.map(x=><div key={x.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 0",borderBottom:"1px solid var(--border)"}}>
        <div><div style={{fontWeight:800,fontSize:14, color:"var(--text-main)"}}>{x.name}</div><div style={{fontSize:11.5,color:"var(--text-sub)",fontWeight:600,marginTop:6, maxWidth:400}}>{x.desc?.slice(0,60)}...</div></div>
        <div style={{display:"flex",gap:8}}><Btn sm variant="secondary" onClick={()=>{setF(x);setShow(true);}}>Düzenle</Btn><Btn sm variant="danger" onClick={()=>del(x.id)}>Sil</Btn></div>
      </div>)}
    </Card>}

    {tab===2 && <Card>
      <div style={{display:"flex", justifyContent:"space-between", marginBottom:20, flexWrap:"wrap", gap:10}}>
         <span style={{fontSize:14, fontWeight:800}}>Derslerden Görüntüler ({safeGallery.length})</span>
         <Btn variant="primary" onClick={()=>setShowGal(true)}>+ URL ile Medya Ekle</Btn>
      </div>
      {safeGallery.length===0 ? <div style={{textAlign:"center",padding:40,color:"var(--text-sub)",fontWeight:700}}>Galeriye henüz medya eklenmemiş.</div> :
      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(160px, 1fr))", gap:16}}>
        {safeGallery.slice().reverse().map(m => (
           <div key={m.id} style={{position:"relative", borderRadius:8, overflow:"hidden", border:"1px solid var(--border)", background:"var(--surface-2)"}}>
             {m.type === 'video' ? <video src={m.url} style={{width:"100%", height:120, objectFit:"cover"}} controls/> : <img src={m.url} style={{width:"100%", height:120, objectFit:"cover"} }/>}
             <button onClick={()=>del(m.id)} style={{position:"absolute", top:6, right:6, background:"var(--danger)", color:"#fff", border:"none", borderRadius:6, cursor:"pointer", padding:"6px 10px", fontWeight:"bold"}}>X</button>
           </div>
        ))}
      </div>}
    </Card>}

    {tab===3 && <Card>
      <div style={{display:"flex", justifyContent:"space-between", marginBottom:20}}>
         <span style={{fontSize:14, fontWeight:800}}>Kayıtlı Yorumlar ({safeTesti.length})</span>
         <Btn variant="success" onClick={generateRandomTestimonials}>🚀 Otomatik 30 Yorum Üret</Btn>
      </div>
      {safeTesti.length===0?<div style={{textAlign:"center",padding:40,color:"var(--text-sub)",fontWeight:700}}>Yorum bulunmuyor.</div>:
      <div style={{maxHeight:400, overflowY:"auto"}}>
        {safeTesti.slice().reverse().map(x=><div key={x.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 0",borderBottom:"1px solid var(--border)"}}>
          <div><div style={{fontWeight:800,fontSize:13, color:"var(--text-main)", fontStyle:"italic"}}>"{x.quote?.slice(0,60)}..."</div><div style={{fontSize:11.5,color:"var(--accent)",fontWeight:800,marginTop:6}}>{x.name} <span style={{color:"var(--text-sub)"}}>— {x.role}</span></div></div>
          <div style={{display:"flex",gap:8}}><Btn sm variant="secondary" onClick={()=>{setF(x);setShow(true);}}>Düzenle</Btn><Btn sm variant="danger" onClick={()=>del(x.id)}>Sil</Btn></div>
        </div>)}
      </div>}
    </Card>}

    {tab===4 && <Card>
      {safeFaq.length===0?<div style={{textAlign:"center",padding:40,color:"var(--text-sub)",fontWeight:700}}>Sıkça sorulan soru bulunmuyor.</div>:
      safeFaq.map(x=><div key={x.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 0",borderBottom:"1px solid var(--border)"}}>
        <div><div style={{fontWeight:800,fontSize:14, color:"var(--text-main)"}}>{x.q}</div><div style={{fontSize:11.5,color:"var(--text-sub)",marginTop:6,maxWidth:500}}>{x.a?.slice(0,80)}...</div></div>
        <div style={{display:"flex",gap:8}}><Btn sm variant="secondary" onClick={()=>{setF(x);setShow(true);}}>Düzenle</Btn><Btn sm variant="danger" onClick={()=>del(x.id)}>Sil</Btn></div>
      </div>)}
    </Card>}

    {tab===5 && <Card>
       <div style={{marginBottom:16, fontSize:14, fontWeight:800}}>Sitedeki İletişim Bilgileri</div>
       <div style={{display:"flex", gap:16, flexWrap:"wrap"}}>
         <div style={{flex:1, minWidth:250}}><Inp label="Telefon Numarası" value={contactForm.phone} onChange={v=>setContactForm({...contactForm, phone:v})} placeholder="+90 5XX XXX XX XX" /></div>
         <div style={{flex:1, minWidth:250}}><Inp label="E-Posta Adresi" value={contactForm.email} onChange={v=>setContactForm({...contactForm, email:v})} placeholder="bilgi@site.com" /></div>
       </div>
       <div style={{display:"flex", gap:16, flexWrap:"wrap"}}>
         <div style={{flex:1, minWidth:250}}><Inp label="WhatsApp Numarası (Sadece Rakam)" value={contactForm.whatsappNum} onChange={v=>setContactForm({...contactForm, whatsappNum:v.replace(/\D/g,'')})} placeholder="905XXXXXXXXX" /></div>
         <div style={{flex:1, minWidth:250}}><Inp label="WhatsApp Hazır Mesajı" value={contactForm.whatsappMsg} onChange={v=>setContactForm({...contactForm, whatsappMsg:v})} placeholder="Merhaba, bilgi almak istiyorum." /></div>
       </div>
       <div style={{background:"rgba(14,165,233,0.1)", padding:"16px", borderRadius:"8px", marginTop:"16px"}}>
         <Inp label="Instagram Profil Linki (Buton İçin)" value={contactForm.instagramUrl} onChange={v=>setContactForm({...contactForm, instagramUrl:v})} placeholder="https://instagram.com/kullaniciadi" />
       </div>
       <Btn onClick={()=>saveSection('contact', contactForm)} style={{marginTop: 16, padding: 12}}>İletişim Bilgilerini Kaydet</Btn>
    </Card>}

    <Modal show={showGal} onClose={()=>setShowGal(false)} title="Galeriye Medya Ekle">
      <Sel label="Medya Türü" value={galForm.type} onChange={v=>setGalForm({...galForm, type:v})} options={[{value:"image",label:"Fotoğraf (JPG/PNG)"},{value:"video",label:"Video (MP4)"}]} />
      <Inp label="Medya Linki (URL)" value={galForm.url} onChange={v=>setGalForm({...galForm, url:v})} placeholder="https://i.hizliresim.com/..." />
      <div style={{fontSize:10.5, color:"var(--danger)", fontWeight:700, marginBottom:16}}>⚠️ Linkin sonu mutlaka .jpg, .png veya .mp4 ile bitmelidir. Sayfa linki kopyalamayınız.</div>
      <Btn full onClick={handleGalleryAdd} style={{padding:12}}>Galeriye Ekle</Btn>
    </Modal>

    <Modal show={show} onClose={()=>setShow(false)} title="Site İçeriği Düzenle">
      {tab===1 && <>
        <Inp label="Branş Adı *" value={f.name} onChange={v=>setF({...f,name:v})}/>
        <Sel label="İkon (Phosphor Icon)" value={f.icon} onChange={v=>setF({...f,icon:v})} options={[{value:"waves",label:"Yüzme"},{value:"basketball",label:"Basketbol"},{value:"boxing-glove",label:"Dövüş"},{value:"person-simple-run",label:"Koşu/Atletizm"},{value:"barbell",label:"Ağırlık/Fitness"},{value:"person-simple-yoga",label:"Yoga/Pilates"},{value:"tennis-ball",label:"Tenis"},{value:"volleyball",label:"Voleybol"}]}/>
        <Inp label="Branş Açıklaması (VIP, Birebir vb. detaylar) *" value={f.desc} onChange={v=>setF({...f,desc:v})} rows={4}/>
      </>}
      {tab===3 && <>
        <Inp label="İsim Soyisim *" value={f.name} onChange={v=>setF({...f,name:v})}/>
        <Inp label="Rol / Eğitim (Örn: Yüzme · Veli)" value={f.role} onChange={v=>setF({...f,role:v})}/>
        <Inp label="Yorum Metni *" value={f.quote} onChange={v=>setF({...f,quote:v})} rows={3}/>
      </>}
      {tab===4 && <>
        <Inp label="Soru *" value={f.q} onChange={v=>setF({...f,q:v})}/>
        <Inp label="Cevap *" value={f.a} onChange={v=>setF({...f,a:v})} rows={3}/>
      </>}
      <Btn full onClick={saveModal} style={{marginTop:20, padding:12}}>Sisteme Kaydet</Btn>
    </Modal>
  </div>
}

function App(){
  const [currentUser, setCurrentUser] = useState(() => { try { return JSON.parse(sessionStorage.getItem("aqua_user")); } catch { return null; } });
  const [isDbLoaded, setIsDbLoaded] = useState(false);
  const [students,setStudents]=useState([]); const [expenses,setExpenses]=useState([]); const [staff,setStaff]=useState([]); const [stockItems,setStockItems]=useState([]);
  const [routes,setRoutes]=useState([]); const [waLinks,setWaLinks]=useState([]); const [appUsers, setAppUsers]=useState([]); const [clubName,setClubName]=useState("NHT CANLI"); const [oldPinCode, setOldPinCode]=useState("0309");
  
  const [siteData, setSiteData] = useState({});
  const [activeTab,setActiveTab]=useState("website"); const [sidebarOpen,setSidebarOpen]=useState(false);
  const [openMenus, setOpenMenus] = useState({"finance": true}); 
  const toggleMenu = (id) => setOpenMenus(prev => ({...prev, [id]: !prev[id]}));
  const handleNav = (id) => { setActiveTab(id); setSidebarOpen(false); }

  useEffect(() => {
    if(!db) { setIsDbLoaded(true); return; }
    const unsub = db.collection("appData").doc("main").onSnapshot((doc) => {
      if (doc.exists) {
        const d = doc.data();
        if (d.students) setStudents(safeArr(d.students));
        if (d.expenses) setExpenses(safeArr(d.expenses));
        if (d.siteData) setSiteData(d.siteData);
        if (d.clubName) setClubName(d.clubName);
        let loadedUsers = safeArr(d.appUsers);
        if (loadedUsers.length === 0) { loadedUsers = [{ id:"admin", username:"admin", password: d.pinCode || "0309", role:"admin", allowedTabs: NAV_ITEMS.map(n=>n.id) }]; }
        setAppUsers(loadedUsers);
      }
      setIsDbLoaded(true);
    }, (err) => { setIsDbLoaded(true); });
    return () => unsub();
  }, []);

  if (!isDbLoaded) return <div style={{display:"flex",flexDirection:"column",height:"100vh",alignItems:"center",justifyContent:"center",background:"var(--bg-color)"}}><div className="spinner"></div></div>;

  if (!currentUser) {
    return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",background:"var(--bg-color)"}}>
      <form onSubmit={(e)=>{ e.preventDefault(); const pwd = document.getElementById("pw").value; if(pwd==="0309" || pwd===oldPinCode){ setCurrentUser({role:"admin"}); sessionStorage.setItem("aqua_user", JSON.stringify({role:"admin"})); } else { alert("Şifre Hatalı"); } }} style={{background:"var(--card-bg)",padding:"40px 32px",borderRadius:16,textAlign:"center",width:"100%",maxWidth:360}}>
        <div style={{fontSize:18,fontWeight:800,marginBottom:24}}>Kurumsal Giriş</div>
        <input id="pw" type="password" placeholder="Yönetici Şifrenizi Girin" style={{width:"100%", padding:"10px", textAlign:"center", marginBottom:16, border:"1px solid var(--border)", borderRadius:"6px", fontSize:"14px"}} />
        <Btn full type="submit">Giriş Yap</Btn>
      </form>
    </div>;
  }

  const visibleNav = NAV_ITEMS.filter(n => currentUser.role === "admin" || (currentUser.allowedTabs || []).includes(n.id) || (n.sub && n.sub.some(s => (currentUser.allowedTabs || []).includes(s.id))));

  return<div className="main-wrapper" style={{display:"flex",height:"100vh",overflow:"hidden",background:"var(--bg-color)"}}>
    <div className={`mobile-overlay ${sidebarOpen ? 'open' : ''}`} onClick={() => setSidebarOpen(false)}></div>
    <div className={`sidebar-desktop ${sidebarOpen ? 'open' : ''}`}>
      <div style={{padding:"28px 24px 24px", borderBottom:`1px solid var(--sidebar-border)`, display:"flex", alignItems:"center", gap:14}}>
        <div style={{width:44,height:44,borderRadius:10,background:`linear-gradient(135deg,var(--accent),#0ea5e9)`,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",boxShadow:"0 4px 12px rgba(14, 165, 233, 0.3)"}}>
           <span style={{color:"white", fontWeight:900, fontSize:16}}>NHT</span>
        </div>
        <div className="logo-admin">
          <span className="nht">NHT</span><span className="canli">CANLI</span>
        </div>
      </div>
      <div style={{flex:1, overflowY:"auto", padding:"20px 16px"}}>
        {visibleNav.map(item => {
           if (item.sub) {
              return <div key={item.id} style={{marginBottom:6}}>
                <button type="button" onClick={()=>toggleMenu(item.id)} className={`nav-parent ${openMenus[item.id] ? 'active' : ''}`}>
                  <Icon name={item.icon} size={18}/> <span style={{marginLeft:12}}>{item.label}</span> <span style={{marginLeft:"auto", fontSize:11}}>{openMenus[item.id] ? '▲' : '▼'}</span>
                </button>
                {openMenus[item.id] && <div style={{marginTop:4, display:"flex", flexDirection:"column", gap:2}}>
                  {item.sub.map(sub => <button key={sub.id} type="button" onClick={()=>handleNav(sub.id)} className={`nav-child ${activeTab===sub.id?'active':''}`}>{sub.label}</button> )}
                </div>}
              </div>
           }
           return <button key={item.id} type="button" onClick={()=>handleNav(item.id)} className={`nav-parent ${activeTab===item.id?'active':''}`} style={{marginBottom:6}}><Icon name={item.icon} size={18}/> <span style={{marginLeft:12}}>{item.label}</span></button>
        })}
      </div>
    </div>
    
    <div style={{flex:1, display:"flex", flexDirection:"column", overflow:"hidden", position:"relative"}}>
      <div className="mobile-topbar">
         <div style={{display:"flex", alignItems:"center", gap:12}}>
            <div style={{width:32,height:32,borderRadius:8,background:`var(--accent)`,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:"white", fontWeight:900, fontSize:12}}>NHT</span></div>
            <div style={{fontSize:16, fontWeight:800, color:"#fff", letterSpacing:-0.5}}>{clubName}</div>
         </div>
         <button className="menu-btn" onClick={()=>setSidebarOpen(true)}><Icon name="menu" size={24}/></button>
      </div>

      <div style={{flex:1, overflowY:"auto"}}>
        <ErrorBoundary>
          {activeTab==="dashboard" && <Dashboard students={students} expenses={expenses}/>}
          {activeTab==="website" && <WebsitePage siteData={siteData} setSiteData={setSiteData}/>}
          {/* DİĞER MODÜLLER GİZLENDİ / AYNI KALDI */}
        </ErrorBoundary>
      </div>
    </div>
  </div>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
